name: Build Android APK (Zero-Setup)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure www Directory Exists
        run: |
          mkdir -p www

      - name: Install Node Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Initialize and Sync Capacitor Android Project
        run: |
          npx cap telemetry off
          npx cap add android || true
          npx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Electrical-Inspection-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
